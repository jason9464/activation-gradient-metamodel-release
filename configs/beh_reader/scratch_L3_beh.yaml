# Three-layer variant (layers 10, 20, 30): scratch_L40_beh.yaml with layers, out, save_steps, nll_every changed. No judge curve, no evaluation; RL follows from the final adapter.
# Behaviour reader (v3), SFT stage: the EM v2 config
# configs/em_v2/scratch_L40_em2.yaml with only reader_dir, out and warmup_steps changed. reader_dir holds C1's
# 25,217 bundles plus the 4,540 behaviour bundles of me-r/behaviour-bundles-v1 (snapshot 09728f63);
# train_correct.jsonl has 56,654 rows -> 7,082 steps at effective batch 8 (rounded up as the HF Trainer counts);
# warmup 708 = 10%. Checkpoint selection stays on C1 val.
# Written by main_run/beh_reader/write_configs.py.
init: scratch
model: Qwen/Qwen3-14B
layers: [10, 20, 30]
center: true
representation: bundle_sum
reader_dir: ${IIF_BASE}/agm_data/c1_reader_40_beh/layers40
out: ${IIF_BASE}/agm_data/runs/reader_scratch_L3_beh
lora_r: 256
lora_alpha: 32
use_rslora: true
lora_dropout: 0.0
lr: 3.0e-5
batch_size: 2  # per GPU (memory knob, --batch-size); accumulation adapts
effective_batch: 8  # sequences per optimizer step over all GPUs (the recipe)
epochs: 1
warmup_steps: 708  # 10% of 7,082 steps (56,654 rows / 8, rounded up)
weight_decay: 0.01
lr_scheduler_type: linear
gradient_checkpointing: false  # longest sample 982 tokens; R0 logs peak_mem_gib, set true only on OOM
max_len: 2048
save_steps: 7082  # final checkpoint only (3-layer variant, no judge curve)
nll_every: 7082  # adapters at step 0 and the final step only
seed: 0
bf16: true
